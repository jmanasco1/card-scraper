name: eBay Graded Card Scan

on:
  schedule:
    # Collection sweep. GitHub delays scheduled runs under load — see README;
    # real cadence is looser than this and runs can be skipped entirely.
    - cron: "*/15 * * * *"
    # Listing re-check (disappearance / sold-proxy). Hourly, offset off the
    # hour so it does not queue behind a collection run on the same minute.
    - cron: "7 * * * *"
    # Aspect enrichment. Hourly, offset again; budget-capped and it skips
    # itself when the daily quota runs low, so collection always wins.
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        type: choice
        default: collect
        options:
          - collect
          - probe
          - probe-filters
          - probe-neither
          - probe-rate
          - probe-recheck
          - probe-slice
          - probe-sets
          - backfill
          - scan
          - test-notify
          - recheck
          - enrich
      max_pages:
        description: "Override pages per run (blank = config.json value)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# Runs commit to the repo, so same-kind runs must not overlap. Grouping by mode
# keeps ad-hoc work (backfill, probes) out of the scheduled collector's group —
# sharing one group meant each 15-minute cron run cancelled whatever manual run
# was still queued behind it. Pushes retry with rebase, so cross-group overlap
# is safe.
concurrency:
  group: ebay-scan-${{ inputs.mode || github.event.schedule || 'default' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      # Set repository variable EBAY_ENV to "sandbox" to target eBay's sandbox
      # deployment. Defaults to production. Keys are not interchangeable.
      EBAY_ENV: ${{ vars.EBAY_ENV || 'production' }}
      # Without this Python buffers stdout, so a traceback lands in the log
      # far from the output that led to it.
      PYTHONUNBUFFERED: "1"
      SCANNER_MAX_PAGES: ${{ inputs.max_pages }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ebay_scanner/requirements.txt

      # eBay application tokens last ~2h. Keying the cache per run_id meant a
      # fresh cache entry every run and frequent misses, so nearly every run
      # re-authenticated and eBay began throttling the token endpoint. Bucket
      # by hour instead: the first run in an hour saves, the rest reuse it.
      - name: Token cache bucket
        id: tokbucket
        run: echo "key=$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Restore token cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: ebay-token-${{ steps.tokbucket.outputs.key }}
          restore-keys: |
            ebay-token-

      - name: Verify credentials are present
        run: |
          if [ -z "$EBAY_CLIENT_ID" ] || [ -z "$EBAY_CLIENT_SECRET" ]; then
            echo "::error::Missing repository secrets EBAY_CLIENT_ID and/or EBAY_CLIENT_SECRET."
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "EBAY_CLIENT_ID  = eBay 'App ID (Client ID)'  from a PRODUCTION keyset"
            echo "EBAY_CLIENT_SECRET = eBay 'Cert ID (Client Secret)' from the same keyset"
            exit 1
          fi

      - name: Probe live API
        if: ${{ inputs.mode == 'probe' }}
        run: python -m ebay_scanner.probe

      - name: Probe filters and category tree
        if: ${{ inputs.mode == 'probe-filters' }}
        run: python -m ebay_scanner.probe_filters

      - name: Probe the neither bucket
        if: ${{ inputs.mode == 'probe-neither' }}
        run: python -m ebay_scanner.probe_neither

      - name: Probe listing velocity by price band
        if: ${{ inputs.mode == 'probe-rate' }}
        run: python -m ebay_scanner.probe_rate

      - name: Probe re-check routes
        if: ${{ inputs.mode == 'probe-recheck' }}
        run: python -m ebay_scanner.probe_recheck

      - name: Send a test notification
        if: ${{ inputs.mode == 'test-notify' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m ebay_scanner.scanner --test-notify

      - name: Reference values, BIN scan, episodes
        id: scan
        if: ${{ inputs.mode == 'scan' || github.event.schedule == '*/15 * * * *' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python -m ebay_scanner.reference
          python -m ebay_scanner.scanner
          python -m ebay_scanner.episodes
          { echo '## Reference values'; echo; echo '```'; cat reference_summary.txt; echo '```'; \
            echo '## BIN scan'; echo; echo '```'; cat scan_summary.txt; echo '```'; \
            echo '## Episodes'; echo; echo '```'; cat episodes_summary.txt; echo '```'; \
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit scanner outputs
        if: ${{ inputs.mode == 'scan' || github.event.schedule == '*/15 * * * *' }}
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ references.jsonl data/reference_snapshots.jsonl \
                  data/flags.jsonl data/episodes.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then echo "nothing staged"; exit 0; fi
          git commit -m "Scan: refs + flags $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push scanner outputs."; exit 1

      - name: Backfill slice inventory
        id: backfill
        if: ${{ inputs.mode == 'backfill' }}
        run: |
          python -m ebay_scanner.backfill
          { echo '## Backfill'; echo; echo '```'; \
            cat backfill_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit backfill data
        if: ${{ inputs.mode == 'backfill' && steps.backfill.outputs.new_count != '0' }}
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ 
          if git diff --staged --quiet; then echo "nothing staged"; exit 0; fi
          git commit -m "Backfill: ${{ steps.backfill.outputs.new_count }} slice listings"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push backfill data."; exit 1

      - name: Probe slice density
        if: ${{ inputs.mode == 'probe-slice' }}
        run: python -m ebay_scanner.probe_slice

      - name: Rank sets by volume
        if: ${{ inputs.mode == 'probe-sets' }}
        run: python -m ebay_scanner.probe_sets

      - name: Commit set ranking
        if: ${{ inputs.mode == 'probe-sets' }}
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ set_volumes.json
          if git diff --staged --quiet; then echo "unchanged"; exit 0; fi
          git commit -m "Refresh set volume ranking"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push set ranking."; exit 1

      - name: Re-check stored listings
        id: recheck
        if: ${{ inputs.mode == 'recheck' || github.event.schedule == '7 * * * *' }}
        run: |
          python -m ebay_scanner.recheck
          { echo '## Listing re-check'; echo; echo '```'; \
            cat recheck_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Enrich listing aspects
        id: enrich
        if: ${{ inputs.mode == 'enrich' || github.event.schedule == '37 * * * *' }}
        run: |
          python -m ebay_scanner.enrich
          { echo '## Aspect enrichment'; echo; echo '```'; \
            cat enrich_summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit aspect data
        if: ${{ inputs.mode == 'enrich' || github.event.schedule == '37 * * * *' }}
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ aspects.jsonl data/lifecycle.jsonl
          if git diff --staged --quiet; then
            echo "Nothing staged; skipping commit."
            exit 0
          fi
          git commit -m "Enrich: ${{ steps.enrich.outputs.written }} listings $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push aspect data after 4 attempts."
          exit 1

      - name: Commit lifecycle data
        if: ${{ inputs.mode == 'recheck' || github.event.schedule == '7 * * * *' }}
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ lifecycle.jsonl data/recheck_state.json
          if git diff --staged --quiet; then
            echo "Nothing staged; skipping commit."
            exit 0
          fi
          git commit -m "Re-check: ${{ steps.recheck.outputs.newly_gone }} listings gone $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then exit 0; fi
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push lifecycle data after 4 attempts."
          exit 1

      - name: Collect listings
        id: collect
        if: ${{ inputs.mode == 'collect' || github.event.schedule == '*/15 * * * *' }}
        run: python -m ebay_scanner.collect

      - name: Build listings page
        if: ${{ inputs.mode == 'collect' || github.event.schedule == '*/15 * * * *' }}
        run: python -m ebay_scanner.build_page

      - name: Commit new data
        if: ${{ (inputs.mode == 'collect' || github.event.schedule == '*/15 * * * *') && steps.collect.outputs.new_count != '0' }}
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/  docs/
          if git diff --staged --quiet; then
            echo "Nothing staged; skipping commit."
            exit 0
          fi
          git commit -m "eBay scan: ${{ steps.collect.outputs.new_count }} new listings $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${GITHUB_REF_NAME}; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing on remote and retrying"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            sleep $((2 ** attempt))
          done
          echo "::error::Could not push collected data after 4 attempts."
          exit 1
