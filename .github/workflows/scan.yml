name: GemRate Scan

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport to scan"
        required: true
        type: choice
        default: basketball
        options:
          - basketball
          - baseball
          - football
          - hockey
          - soccer
          - tcg
      reset:
        description: "Ignore checkpoint and rescan from scratch"
        required: false
        type: boolean
        default: false
      max_sets:
        description: "Override max sets per run (blank = config.json value)"
        required: false
        type: string
        default: ""
      max_cards:
        description: "Override max card pages per run (blank = config.json value)"
        required: false
        type: string
        default: ""
      debug:
        description: "Run site recon first and log captured network responses"
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 13:00 UTC (uses default_sport from config.json)
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Headful Chrome under xvfb — headless mode trips Cloudflare's bot check
      GEMRATE_HEADFUL: "1"
      # gemrate.com is behind Cloudflare, which blocks GitHub's datacenter IPs
      # outright. Set a residential/mobile proxy URL (or scraping-API endpoint)
      # in the repo secret GEMRATE_PROXY to let the scan reach the site.
      # Format: http://user:pass@host:port  (empty = direct, will be blocked)
      GEMRATE_PROXY: ${{ secrets.GEMRATE_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Real Google Chrome passes Cloudflare far better than bundled Chromium
          playwright install --with-deps chrome
          playwright install --with-deps chromium

      - name: Cloudflare transport probe (debug only)
        if: ${{ github.event.inputs.debug == 'true' }}
        run: python -m scraper.probe

      - name: Site recon (debug only)
        if: ${{ github.event.inputs.debug == 'true' }}
        run: xvfb-run -a python -m scraper.recon

      - name: Run scan
        run: |
          SPORT="${{ github.event.inputs.sport }}"
          ARGS=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then ARGS="$ARGS --reset"; fi
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          if [ -n "${{ github.event.inputs.max_sets }}" ]; then ARGS="$ARGS --max-sets ${{ github.event.inputs.max_sets }}"; fi
          if [ -n "${{ github.event.inputs.max_cards }}" ]; then ARGS="$ARGS --max-cards ${{ github.event.inputs.max_cards }}"; fi
          if [ -n "$SPORT" ]; then
            xvfb-run -a python -m scraper.scan --sport "$SPORT" $ARGS
          else
            xvfb-run -a python -m scraper.scan $ARGS
          fi

      - name: Commit results
        run: |
          git config user.name "gemrate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Scan results $(date -u +%F)"
          git push
