name: GemRate Scan

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport to scan"
        required: true
        type: choice
        default: basketball
        options:
          - basketball
          - baseball
          - football
          - hockey
          - soccer
          - tcg
      reset:
        description: "Ignore checkpoint and rescan from scratch"
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 13:00 UTC (uses default_sport from config.json)
    - cron: "0 13 * * 1"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scan
        run: |
          SPORT="${{ github.event.inputs.sport }}"
          RESET=""
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then RESET="--reset"; fi
          if [ -n "$SPORT" ]; then
            python -m scraper.scan --sport "$SPORT" $RESET
          else
            python -m scraper.scan
          fi

      - name: Commit results
        run: |
          git config user.name "gemrate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Scan results $(date -u +%F)"
          git push
