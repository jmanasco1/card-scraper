# Manual-dispatch only.
#
# The weekly schedule was removed deliberately. This scan cannot complete on a
# GitHub-hosted runner without help on two separate fronts:
#
#   1. gemrate.com is behind Cloudflare, which blocks Azure/GitHub datacenter
#      IPs outright — verified with real Chrome, xvfb and TLS impersonation.
#      Needs the GEMRATE_PROXY secret (residential/mobile egress).
#   2. Pricing cards means eBay sold-listing searches, and eBay serves captchas
#      to automation. The scan pauses for a human to solve them, which no
#      unattended CI run can do.
#
# So the scheduled run could only ever fail, and did so every Monday. Run the
# scan locally instead (see README). This workflow is kept for the case where
# a proxy is configured and you want a universe-only refresh.
name: GemRate Scan

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Sport to scan"
        required: true
        type: choice
        default: basketball
        options: [basketball, baseball, football, hockey, soccer, tcg]
      universe:
        description: "Card pool: wide (long tail) or top (all-time top cards)"
        required: false
        type: choice
        default: wide
        options: [wide, top]
      limit:
        description: "How many cards to price on eBay (blank = config.json)"
        required: false
        type: string
        default: ""
      debug:
        description: "Run site recon first and log captured network responses"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Headful Chrome under xvfb — headless mode trips Cloudflare's bot check
      GEMRATE_HEADFUL: "1"
      # Required: without a residential proxy Cloudflare blocks this runner.
      # Format: http://user:pass@host:port
      GEMRATE_PROXY: ${{ secrets.GEMRATE_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chrome
          playwright install --with-deps chromium

      - name: Warn if no proxy is configured
        if: ${{ env.GEMRATE_PROXY == '' }}
        run: |
          echo "::warning::GEMRATE_PROXY is not set. Cloudflare blocks GitHub's" \
               "datacenter IPs, so this run will almost certainly find no cards." \
               "Run the scan locally instead, or add the secret."

      - name: Cloudflare transport probe (debug only)
        if: ${{ github.event.inputs.debug == 'true' }}
        run: python -m scraper.probe

      - name: Site recon (debug only)
        if: ${{ github.event.inputs.debug == 'true' }}
        run: xvfb-run -a python -m scraper.recon

      - name: Run scan
        run: |
          ARGS="--sport ${{ github.event.inputs.sport }}"
          ARGS="$ARGS --universe ${{ github.event.inputs.universe }}"
          if [ "${{ github.event.inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          xvfb-run -a python -m scraper.scan $ARGS

      - name: Commit results
        run: |
          git config user.name "gemrate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git diff --staged --quiet || git commit -m "Scan results $(date -u +%F)"
          git push
